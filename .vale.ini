# Prose gate for the vault. Rai = voice.md hard rules; ai-tells = tbhb/vale-ai-tells.
# Styles live in 03-rai/config/vale/styles; `vale sync` refreshes the ai-tells package.
StylesPath = 03-rai/config/vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells.zip

[*.md]
BasedOnStyles = Rai, ai-tells
# ai-tells rules that contradict voice.md (colons are the em-dash replacement) or duplicate Rai.EmDash
ai-tells.ColonUsage = NO
ai-tells.EmDashUsage = NO
ai-tells.ParallelStaccato = NO   # voice.md wants short hard stops
