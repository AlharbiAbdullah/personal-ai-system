# /fusion panel: one row per voice. The single source for every sub-skill.
# Subscriptions: agy = Google AI Pro, claude = Claude Max, and opencode and pi
# run on two: Ollama Pro (ollama/ models) and ChatGPT Plus (openai/ models,
# through Sign in with ChatGPT). Effort is the reasoning level each call asks for.
# One voice per model: a second copy of a model is a resample, and it would
# count twice toward the panel's majority. The harnesses split the models so a
# broken harness costs two voices, not all of them.
#
# voice         harness    model                         effort
gemini          agy        gemini-3.1-pro                high
minimax         opencode   ollama/minimax-m3:cloud       high
glm             opencode   ollama/glm-5.3:cloud          high
deepseek        pi         ollama/deepseek-v4-pro:cloud  high
sol             pi         openai/gpt-6.1-sol            xhigh
opus            claude     claude-opus-5-5               max
