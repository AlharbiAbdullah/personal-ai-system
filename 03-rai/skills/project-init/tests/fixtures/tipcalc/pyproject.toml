[project]
name = "tipcalc"
version = "0.1.0"
description = "Tiny CLI that prints the tip for a bill."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tipcalc = "tipcalc:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = ["spec(*ids): scenario ids this test proves"]

# CHANGELOG.md in Keep a Changelog form. Merge runs `git cliff --with-commit "<title>" -o CHANGELOG.md`.
# Groups come from the conventional type; spec, chore, ci, docs, test, style, build and refactor are left out.
[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format follows Keep a Changelog (https://keepachangelog.com/en/1.1.0/)."""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor %}\
{% endfor %}\
"""
trim = false
postprocessors = [
  { pattern = "\n{3,}", replace = "\n\n" },
  { pattern = "\n+$", replace = "\n" },
]

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 2 -->Removed" },   # any `type!:` or BREAKING CHANGE footer
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^change", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = ".*", skip = true },
]

[tool.git-cliff.bump]
features_always_bump_minor = true
breaking_always_bump_major = false        # while the version is 0.x, a breaking change bumps the minor
